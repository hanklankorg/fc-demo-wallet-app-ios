# Release Dev Workflow
#
# This workflow builds the iOS app and uploads to TestFlight for testing.
# Triggered manually via workflow_dispatch (GitHub Actions UI).
#
# How to use:
# 1. Go to Actions tab in GitHub
# 2. Select "Release Dev Workflow"
# 3. Click "Run workflow"
# 4. Select branch to build from
# 5. Click "Run workflow"
#
# Created artifacts:
# - IPA uploaded to TestFlight

name: Release Dev Workflow

on:
  workflow_dispatch:

concurrency:
  group: release-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-number:
    uses: ./.github/workflows/compute-build-number.yml
    permissions:
      contents: read

  build:
    needs: build-number
    uses: diggsweden/forge-ci/.github/workflows/build-xcode-ios.yml@PIN_FORGE_CI_SHA # v0.90.0
    permissions:
      contents: read
    secrets:
      # Forge CI names the certificate secrets IOS_SIGNING_*; the repository
      # secrets keep their names. The build mints its own keychain password.
      IOS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
      IOS_SIGNING_CERTIFICATE_PASSPHRASE: ${{ secrets.CERTIFICATE_PASSPHRASE }}
      PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
      XCCONFIG_BASE64: ${{ secrets.XCCONFIG_BASE64 }}
    with:
      # The full commit the uses: ref above names; the macOS job builds the
      # CLI from exactly this commit.
      forge-ci-binary-ref: PIN_FORGE_CI_SHA # v0.90.0
      xcode-version: ${{ vars.XCODE_VERSION }}
      # MACOS_VERSION holds the runner label, as before.
      runs-on-darwin-arm64: ${{ format('["{0}"]', vars.MACOS_VERSION || 'macos-26') }}
      scheme: "Wallet Demo"
      workspace: "Wallet.xcworkspace"
      configuration: Release
      enable-code-signing: true
      export-options-var: EXPORT_OPTIONS_BASE64
      artifact-name: wallet-ios-demo-dev
      include-tag: false
      build-number: ${{ needs.build-number.outputs.value }}
      use-xcodegen: true

  upload-testflight:
    needs: build
    uses: diggsweden/forge-ci/.github/workflows/publish-apple-appstore.yml@PIN_FORGE_CI_SHA # v0.90.0
    permissions:
      actions: read # Download the IPA of the build job
      contents: read
    secrets:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    with:
      forge-ci-binary-ref: PIN_FORGE_CI_SHA # v0.90.0
      branch: ${{ github.ref }}
      ipa-artifact-name: wallet-ios-demo-dev
      submit-for-review: false
      skip-validation: false
